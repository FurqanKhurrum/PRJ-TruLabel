<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruLabel - Image Upload Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #4c1d95;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .result p {
            margin: 5px 0;
            color: #333;
        }
        
        .error {
            background: #fee;
            border-left-color: #f44;
        }
        
        .error h3 {
            color: #f44;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .product-image {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 TruLabel Scanner</h1>
        <p class="subtitle">Upload an image with a barcode to get product information</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📸</div>
            <h3>Click or drag image here</h3>
            <p style="color: #666; margin-top: 10px;">Supports: JPG, PNG, GIF</p>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        
        <button id="scanButton" disabled>Scan Barcode</button>
        
        <div id="preview" class="preview" style="display: none;">
            <h4 style="color: #666; margin-bottom: 10px;">Selected Image:</h4>
            <img id="previewImage" src="" alt="Preview">
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Scanning barcode...</p>
        </div>
        
        <div id="result" style="display: none;"></div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const scanButton = document.getElementById('scanButton');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        
        let selectedFile = null;
        
        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        // File selected
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }
            
            selectedFile = file;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Enable scan button
            scanButton.disabled = false;
            result.style.display = 'none';
        }
        
        // Scan button click
        scanButton.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            // Show loading
            loading.style.display = 'block';
            result.style.display = 'none';
            scanButton.disabled = true;
            
            // Create form data
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                // Send to API
                const response = await fetch('http://localhost:8000/api/scan-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Success
                    displayResult(data);
                } else {
                    // Error
                    displayError(data.detail || 'An error occurred');
                }
                
            } catch (error) {
                displayError('Failed to connect to server. Make sure the backend is running.');
            } finally {
                loading.style.display = 'none';
                scanButton.disabled = false;
            }
        });
        
        function displayResult(data) {
            const product = data.product;
            result.innerHTML = `
                <h3>✅ Product Found!</h3>
                <p><strong>Barcode:</strong> ${data.barcode}</p>
                <p><strong>Name:</strong> ${product.product_name}</p>
                <p><strong>Brand:</strong> ${product.brand_name}</p>
                <p><strong>Origin:</strong> ${product.country_of_origin}</p>
                <p><strong>Category:</strong> ${product.category}</p>
                ${product.labels ? `<p><strong>Labels:</strong> ${product.labels}</p>` : ''}
                ${product.ecoscore ? `<p><strong>Eco Score:</strong> ${product.ecoscore}/100</p>` : ''}
                ${product.image_url ? `<img class="product-image" src="${product.image_url}" alt="Product">` : ''}
            `;
            result.className = 'result';
            result.style.display = 'block';
        }
        
        function displayError(message) {
            result.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
            `;
            result.className = 'result error';
            result.style.display = 'block';
        }
    </script>
</body>
</html>
