<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruLabel - Product Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .upload-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            flex: 1;
            padding: 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #f0f0ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #4c1d95;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .manual-entry {
            text-align: center;
            padding: 20px;
        }
        
        .manual-entry input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #667eea;
            border-radius: 10px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 2px;
        }
        
        .manual-entry input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .manual-entry p {
            margin: 15px 0;
            color: #666;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .preview {
            margin-top: 20px;
            text-align: center;
        }
        
        .preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .result h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .result h4 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
        }
        
        .info-row {
            display: flex;
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
        }
        
        .info-label {
            font-weight: bold;
            color: #667eea;
            min-width: 180px;
        }
        
        .info-value {
            color: #333;
            flex: 1;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
            margin-bottom: 4px;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-cache-hit {
            background: #28a745;
            color: white;
        }
        
        .badge-cache-miss {
            background: #ffc107;
            color: #333;
        }
        
        .score {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin: 5px 0;
        }
        
        .score-good {
            background: #d4edda;
            color: #155724;
        }
        
        .score-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .score-poor {
            background: #f8d7da;
            color: #721c24;
        }
        
        .error {
            background: #fee;
            border-left-color: #f44;
        }
        
        .error h3 {
            color: #f44;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .product-image {
            max-width: 250px;
            margin: 15px auto;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: block;
        }
        
        .section {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 TruLabel Scanner</h1>
        <p class="subtitle">Scan or enter a barcode to get product information</p>
        
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('scan')">📸 Scan Image</button>
            <button class="tab" onclick="switchTab('manual')">⌨️ Enter Barcode</button>
        </div>
        
        <!-- Scan Tab -->
        <div id="scanTab" class="tab-content active">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📸</div>
                <h3>Click or drag image here</h3>
                <p style="color: #666; margin-top: 10px;">Supports: JPG, PNG, GIF</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <button id="scanButton" disabled>Scan Barcode</button>
            
            <div id="preview" class="preview" style="display: none;">
                <h4 style="color: #666; margin-bottom: 10px;">Selected Image:</h4>
                <img id="previewImage" src="" alt="Preview">
            </div>
        </div>
        
        <!-- Manual Entry Tab -->
        <div id="manualTab" class="tab-content">
            <div class="manual-entry">
                <div class="upload-icon">🔢</div>
                <h3 style="color: #667eea; margin-bottom: 15px;">Enter Barcode</h3>
                <p>Type the barcode number printed on the product</p>
                <input 
                    type="text" 
                    id="manualBarcode" 
                    placeholder="e.g., 06746209"
                    maxlength="13"
                    pattern="[0-9]*"
                >
                <p style="margin-top: 10px;">
                    <small>💡 Tip: Look for the number under the barcode</small>
                </p>
            </div>
            
            <button id="lookupButton">Lookup Product</button>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching for product...</p>
        </div>
    </div>
    
    <script>
        // Tab switching
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'scan') {
                document.getElementById('scanTab').classList.add('active');
            } else {
                document.getElementById('manualTab').classList.add('active');
                document.getElementById('manualBarcode').focus();
            }
            
            // Clear results
            document.getElementById('result').style.display = 'none';
        }
        
        // Scan tab functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const scanButton = document.getElementById('scanButton');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const resultsContainer = document.getElementById('resultsContainer');
        
        let selectedFile = null;
        
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });
        
        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }
            
            selectedFile = file;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            scanButton.disabled = false;
            resultsContainer.style.display = 'none';
        }
        
        scanButton.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            loading.style.display = 'block';
            resultsContainer.style.display = 'none';
            scanButton.disabled = true;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                const response = await fetch('http://localhost:8000/api/scan-image', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    displayResult(data);
                } else {
                    displayError(data.detail || 'An error occurred');
                }
                
            } catch (error) {
                displayError('Failed to connect to server. Make sure the backend is running.');
            } finally {
                loading.style.display = 'none';
                scanButton.disabled = false;
            }
        });
        
        // Manual entry functionality
        const manualBarcode = document.getElementById('manualBarcode');
        const lookupButton = document.getElementById('lookupButton');
        
        // Only allow numbers
        manualBarcode.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
        
        // Search on Enter key
        manualBarcode.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                lookupButton.click();
            }
        });
        
        lookupButton.addEventListener('click', async () => {
            const barcode = manualBarcode.value.trim();
            
            if (!barcode) {
                alert('Please enter a barcode');
                return;
            }
            
            if (barcode.length < 6) {
                alert('Barcode must be at least 6 digits');
                return;
            }
            
            loading.style.display = 'block';
            result.style.display = 'none';
            lookupButton.disabled = true;
            
            try {
                const response = await fetch(`http://localhost:8000/api/product/${barcode}`);
                const data = await response.json();
                
                if (response.ok) {
                    displayResult(data);
                } else {
                    displayError(data.detail || `Product not found for barcode: ${barcode}`);
                }
                
            } catch (error) {
                displayError('Failed to connect to server. Make sure the backend is running.');
            } finally {
                loading.style.display = 'none';
                lookupButton.disabled = false;
            }
        });
        
        function getScoreClass(score) {
            if (!score) return 'score-medium';
            if (score >= 70) return 'score-good';
            if (score >= 40) return 'score-medium';
            return 'score-poor';
        }
        
        function displayResult(data) {
            const product = data.product;
            
            let html = `
                <h3>✅ Product Found!</h3>
                
                ${product.cache_hit !== undefined ? `
                    <div style="margin-bottom: 15px;">
                        <span class="badge ${product.cache_hit ? 'badge-cache-hit' : 'badge-cache-miss'}">
                            ${product.cache_hit ? '⚡ From Cache (Fast!)' : '🌐 From API (Cached for next time)'}
                        </span>
                    </div>
                ` : ''}
                
                ${product.image_url ? `<img class="product-image" src="${product.image_url}" alt="${product.product_name}">` : ''}
                
                <div class="section">
                    <h4>📦 Basic Information</h4>
                    <div class="info-row">
                        <div class="info-label">Barcode:</div>
                        <div class="info-value">${data.barcode}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Product Name:</div>
                        <div class="info-value">${product.product_name}</div>
                    </div>
                    <div class="info-row">
                        <div class="info-label">Brand:</div>
                        <div class="info-value">${product.brand_name || 'Unknown'}</div>
                    </div>
                    ${product.brand_owner ? `
                    <div class="info-row">
                        <div class="info-label">Brand Owner:</div>
                        <div class="info-value">${product.brand_owner}</div>
                    </div>
                    ` : ''}
                    ${product.quantity ? `
                    <div class="info-row">
                        <div class="info-label">Quantity:</div>
                        <div class="info-value">${product.quantity}</div>
                    </div>
                    ` : ''}
                    ${product.category ? `
                    <div class="info-row">
                        <div class="info-label">Category:</div>
                        <div class="info-value">${product.category}</div>
                    </div>
                    ` : ''}
                </div>
                
                ${product.country_of_origin || product.manufacturing_places ? `
                <div class="section">
                    <h4>🌍 Origin & Manufacturing</h4>
                    ${product.country_of_origin ? `
                    <div class="info-row">
                        <div class="info-label">Country of Origin:</div>
                        <div class="info-value">${product.country_of_origin}</div>
                    </div>
                    ` : ''}
                    ${product.manufacturing_places ? `
                    <div class="info-row">
                        <div class="info-label">Made In:</div>
                        <div class="info-value">${product.manufacturing_places}</div>
                    </div>
                    ` : ''}
                </div>
                ` : ''}
                
                ${product.labels ? `
                <div class="section">
                    <h4>✅ Labels & Certifications</h4>
                    <div class="info-row">
                        <div class="info-label">Labels:</div>
                        <div class="info-value">
                            ${product.labels.split(',').map(label => 
                                `<span class="badge badge-success">${label.trim()}</span>`
                            ).join('')}
                        </div>
                    </div>
                </div>
                ` : ''}
                
                <div class="section">
                    <h4>📊 Product Scores</h4>
                    ${product.nutriscore_grade ? `
                    <div class="info-row">
                        <div class="info-label">Nutri-Score:</div>
                        <div class="info-value">
                            <span class="badge badge-success">
                                Grade ${product.nutriscore_grade.toUpperCase()}
                            </span>
                        </div>
                    </div>
                    ` : ''}
                    ${product.ecoscore ? `
                    <div class="info-row">
                        <div class="info-label">Eco-Score:</div>
                        <div class="info-value">
                            <span class="score ${getScoreClass(product.ecoscore)}">
                                ${product.ecoscore}/100
                            </span>
                        </div>
                    </div>
                    ` : ''}
                </div>
                
                ${product.link ? `
                <div style="margin-top: 20px; text-align: center;">
                    <a href="${product.link}" target="_blank" style="color: #667eea; text-decoration: none;">
                        🔗 View on Open Food Facts
                    </a>
                </div>
                ` : ''}
            `;
            
            result.innerHTML = html;
            result.className = 'result';
            result.style.display = 'block';
        }
        
        function displayError(message) {
            result.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
                <p style="margin-top: 15px; color: #666;">
                    <strong>💡 Try this:</strong>
                    <br>• If scanning failed, try the "Enter Barcode" tab
                    <br>• Type the number printed under the barcode
                    <br>• Example: 06746209
                </p>
            `;
            resultsContainer.style.display = 'block';
        }
    </script>
</body>
</html>
